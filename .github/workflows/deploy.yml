name: Build and Deploy Food Khaan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define Image Tags
        id: meta
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          BACKEND_IMG="ghcr.io/${REPO_LOWER}/backend:${SHA_TAG}"
          FRONTEND_IMG="ghcr.io/${REPO_LOWER}/frontend:${SHA_TAG}"
          
          echo "backend_image=$BACKEND_IMG" >> $GITHUB_OUTPUT
          echo "frontend_image=$FRONTEND_IMG" >> $GITHUB_OUTPUT
          echo "backend_latest=ghcr.io/${REPO_LOWER}/backend:latest" >> $GITHUB_OUTPUT
          echo "frontend_latest=ghcr.io/${REPO_LOWER}/frontend:latest" >> $GITHUB_OUTPUT

          echo "BACKEND_IMG=$BACKEND_IMG"
          echo "FRONTEND_IMG=$FRONTEND_IMG"

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: |
            DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy
          tags: |
            ${{ steps.meta.outputs.backend_image }}
            ${{ steps.meta.outputs.backend_latest }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_BALE_MINI_APP_ENABLED=true
          tags: |
            ${{ steps.meta.outputs.frontend_image }}
            ${{ steps.meta.outputs.frontend_latest }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Trigger Remote Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
        run: |
          set -euo pipefail
          APP_DIR="/home/develop/food-khaan"
          scp -i "$HOME/.ssh/id_deploy" -P "$SSH_PORT" -o StrictHostKeyChecking=yes \
            compose.yml "$SSH_USER@$SSH_HOST:$APP_DIR/compose.yml"
          ssh -i "$HOME/.ssh/id_deploy" -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "bash -s" <<EOF
            set -euo pipefail
            cd "$APP_DIR"
            
            sed -i "s|^KHAAN_BACKEND_IMAGE=.*|KHAAN_BACKEND_IMAGE=${BACKEND_IMAGE}|" .env
            sed -i "s|^KHAAN_WEB_IMAGE=.*|KHAAN_WEB_IMAGE=${FRONTEND_IMAGE}|" .env
            
            if ! docker compose -f compose.yml config --quiet; then
              echo "Deploy preflight failed: compose configuration is invalid"
              exit 1
            fi
            docker compose -f compose.yml pull
            if ! docker compose -f compose.yml up -d --remove-orphans; then
              echo "Deploy failed while starting services. Collecting safe diagnostics..."
              docker compose -f compose.yml ps -a || true
              echo "Backend container state:"
              docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}not-configured{{end}}' food-khaan-backend || true
              echo "Backend healthcheck history:"
              docker inspect -f '{{if .State.Health}}{{range .State.Health.Log}}{{printf "time=%s exit=%d output=%s\\n" .End .ExitCode .Output}}{{end}}{{end}}' food-khaan-backend || true
              echo "Backend startup logs (last 160 lines):"
              docker logs --tail 160 food-khaan-backend 2>&1 || true
              echo "PostgreSQL logs (last 60 lines):"
              docker logs --tail 60 food-khaan-postgres 2>&1 || true
              exit 1
            fi
            deadline=\$(( \$(date +%s) + 120 ))
            while :; do
              all_healthy=1
              for name in food-khaan-postgres food-khaan-backend food-khaan-frontend; do
                if ! status="\$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "\$name")"; then
                  echo "Deploy failed: \$name is missing or docker inspect failed"
                  exit 1
                fi
                if [ "\$status" = "unhealthy" ] || [ "\$status" = "exited" ] || [ "\$status" = "dead" ]; then
                  echo "Deploy failed: \$name is \$status"
                  exit 1
                fi
                if [ "\$status" != "healthy" ]; then
                  all_healthy=0
                fi
              done
              if [ "\$all_healthy" = 1 ]; then
                break
              fi
              now=\$(date +%s)
              if [ "\$now" -ge "\$deadline" ]; then
                echo "Deploy failed: containers did not become healthy within 120s"
                exit 1
              fi
              sleep 5
            done
            docker compose -f compose.yml ps
            docker image prune -f
          EOF
