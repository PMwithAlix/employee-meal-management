name: Deploy Frontend

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@60edb22ea587637f45d1744122d1416a4f4d7b0 # v4.0.5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: final-product/package-lock.json

      - name: Install dependencies and build
        working-directory: final-product
        run: |
          npm ci
          npm run build

      - name: Deploy dist to server
        uses: appleboy/scp-action@bf279722388120b035371aaded8893d73501c8b # v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: final-product/dist/*
          target: /home/ubuntu/install/docker-files/front/food
          strip_components: 2
          overwrite: true