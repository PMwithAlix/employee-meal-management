# Included from the image http {} block.
# Access logs must not store the webhook credential. $request / $uri / $request_uri
# are never written; any /api/v1/bale/webhook/<segment> URI is replaced wholesale.
map $request_uri $khaan_log_uri {
  ~^/api/v1/bale/webhook/.+  /api/v1/bale/webhook/[redacted];
  default $request_uri;
}

map $http_referer $khaan_log_referer {
  ~*/api/v1/bale/webhook/  [redacted];
  default $http_referer;
}

log_format khaan '$remote_addr - $remote_user [$time_local] "$request_method $khaan_log_uri $server_protocol" $status $body_bytes_sent "$khaan_log_referer" "$http_user_agent"';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;
  access_log /var/log/nginx/access.log khaan;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Exact secret segment (43-char base64url SHA-256). Stock nginx error logs
  # include the raw request line and cannot redact it, so discard them here.
  # The access log still records method and status via the khaan format above.
  location ~ '^/api/v1/bale/webhook/[A-Za-z0-9_-]{43}$' {
    error_log /dev/null emerg;
    include /etc/nginx/khaan-api-proxy.inc;
  }

  location /api/ {
    include /etc/nginx/khaan-api-proxy.inc;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
